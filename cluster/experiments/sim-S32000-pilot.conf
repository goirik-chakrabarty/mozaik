# sim-S32000-pilot — de-risk + measure the S32000-all-videos pipeline (VIDEO PATH, untested at S500).
# Single non-colliding task: array index 7 -> TRIAL=7, CHUNK=0 (N_CHUNKS=1) -> noise_seed=7000.
# TRIAL=7 avoids the S500 trial0/1/2 datastores (the sim runner rm -rf's its own trial{T}_chunk{C} dir).
# Pilot stimuli: 30 images + 9 videos (Clip/Monet2/Trippy/DotSequence, 300-900 frames). Consumed by cluster/submit.sh.
WORKLOAD=sim

# --- scheduler ---
PARTITION=medium96s
CONSTRAINT=sapphirerapids
NTASKS=12
MEM=250G
TIME=12:00:00
ARRAY=7
JOB_NAME=mozaik-s32k-pilot
OUTPUT=./slurm_s32000_pilot/mozaik-s32kpilot-%A_%a.out
ERROR=./slurm_s32000_pilot/mozaik-s32kpilot-%A_%a.err

# --- runtime ---
N_CHUNKS=1
CHUNK_DIR=/data/MOZAIK/S32000_pilot/chunks
# Input Experanto screen dataset (materialized from an explicit image+video selection).
BASE_PATH=/data/MOZAIK/S32000_pilot/input_screen
# qpatch production container.
SIF_IMAGE=/mnt/vast-nhr/projects/nix00014/goirik/MOZAIK-new/mozaik-sif/mozaik-opt-qpatch_2026-07-14.sif
# PARAM_FILE default param/defaults (mozaik_seed=1023, pynn_seed=5).
