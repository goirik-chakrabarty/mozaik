# sim-S500 — P4 S500 subset (500 images) × 3 trials × 6 chunks = 18 array tasks.
# array id -> TRIAL=id/6, CHUNK=id%6 (run_job.sh); noise_seed = TRIAL*1000 + CHUNK (runner).
# Input dataset = materialized S500 screen dataset (BASE_PATH); neo14 container. Consumed by cluster/submit.sh.
WORKLOAD=sim

# --- scheduler ---
PARTITION=medium96s
CONSTRAINT=sapphirerapids
NTASKS=12
MEM=250G
TIME=12:00:00
ARRAY=0-17
JOB_NAME=mozaik-s500
OUTPUT=./slurm_s500/mozaik-s500-%A_%a.out
ERROR=./slurm_s500/mozaik-s500-%A_%a.err

# --- runtime ---
N_CHUNKS=6
CHUNK_DIR=/data/MOZAIK/S500_3trial/chunks
# Input Experanto screen dataset (materialized from subset_S500.json); read by create_randomized_experanto.
BASE_PATH=/data/MOZAIK/S500_3trial/input_screen
# neo14 container (absolute path).
SIF_IMAGE=/mnt/vast-nhr/projects/nix00014/goirik/MOZAIK-new/mozaik-sif/mozaik-opt_2026-07-10.sif
# PARAM_FILE default param/defaults (mozaik_seed=1023, pynn_seed=5).
