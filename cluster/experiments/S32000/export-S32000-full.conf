# export-S32000-full — Experanto export of the S32000-all-videos full trial (trial 0), reading datastores
# from the ceph-ssd workspace (WORKSPACE bound to /ws). Full export (spikes + screen).
# Export appends into ONE spikes.npy per trial (is_resume = CHUNK_START>0), so chunks are processed
# SEQUENTIALLY. At ~1.5 h load/chunk, 64 chunks (~80 h) exceeds one 48 h job -> Phase 5 runs this as a
# CHAIN of chunk-range jobs via --dependency=afterok, each with its own CHUNK_START/CHUNK_END (see
# docs/plan/plan-for-running-full-dataset.md Phase 5). This base conf exports the full range 0..64.
# Copy to export-S32000-full-{a,b,c}.conf and set CHUNK_START/CHUNK_END for the chain.
WORKLOAD=export

# --- scheduler ---
PARTITION=medium96s
CONSTRAINT=sapphirerapids
NTASKS=1
MEM=128G
TIME=48:00:00
ARRAY=0
JOB_NAME=export-s32k-full
OUTPUT=./slurm_s32000_full/export-%A_%a.out
ERROR=./slurm_s32000_full/export-%A_%a.err

# --- runtime (TRIAL=array_id=0) ---
N_CHUNKS=64
CHUNK_START=0
CHUNK_END=64
BATCH_SIZE=1
CHUNK_DIR=/ws/S32000_full/chunks
OUTPUT_PREFIX=/ws/S32000_full/export/trial
DATASTORE_PREFIX=/ws/S32000_full/datastores
# ceph-ssd workspace bound to /ws so DATASTORE_PREFIX/OUTPUT_PREFIX resolve.
WORKSPACE=/mnt/ceph-ssd/workspaces/ws/nix00014/u18196-mozaik_s32000
# EXPORT_MODE unset -> full export (spikes + screen).
SIF_IMAGE=/mnt/vast-nhr/projects/nix00014/goirik/MOZAIK-new/mozaik-sif/mozaik-opt-qpatch_2026-07-14.sif
