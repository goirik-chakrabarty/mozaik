# sim-S32000-full — S32000-all-videos, ONE FULL TRIAL (trial 0). 41,723 stimuli (31,706 img + 10,017
# unique vid) presented to LSV1M V1, datastore redirected to a ceph-ssd workspace. 64 time-balanced chunks
# (per-frame video cost; each ~44 h estimated / ~37 h expected real, under the 48 h limit). ARRAY=0-63 with
# N_CHUNKS=64 -> every task TRIAL=id/64=0, CHUNK=id%64, noise_seed=trial*1000+chunk=chunk (0..63).
# Datastore lands at /ws/S32000_full/datastores/<name> via the RESULTS_DIR redirect (WORKSPACE bound to /ws).
# Consumed by cluster/submit.sh. See docs/plan/plan-for-running-full-dataset.md + audit 26-07-14_S32000_FULL_RUN_SIZING.md.
WORKLOAD=sim

# --- scheduler ---
PARTITION=medium96s
CONSTRAINT=sapphirerapids
NTASKS=12
MEM=250G
TIME=48:00:00
ARRAY=0-63
JOB_NAME=mozaik-s32k-full
OUTPUT=./slurm_s32000_full/sim-%A_%a.out
ERROR=./slurm_s32000_full/sim-%A_%a.err

# --- runtime ---
N_CHUNKS=64
CHUNK_DIR=/ws/S32000_full/chunks
BASE_PATH=/ws/S32000_full/input_screen
# ceph-ssd workspace bound to /ws; datastore redirected there (NOT project vast -> no S500 collision).
WORKSPACE=/mnt/ceph-ssd/workspaces/ws/nix00014/u18196-mozaik_s32000
RESULTS_DIR=/ws/S32000_full/datastores
# qpatch production container.
SIF_IMAGE=/mnt/vast-nhr/projects/nix00014/goirik/MOZAIK-new/mozaik-sif/mozaik-opt-qpatch_2026-07-14.sif
# PARAM_FILE default param/defaults (mozaik_seed=1023, pynn_seed=5).
