# export-S32000-pilot — full (spikes+screen) Experanto export of the pilot sim (TRIAL=7).
# Validates the VIDEO export path (movie_frame_duration_ms=35) untested at S500, and measures export size.
# ARRAY=7 -> TRIAL=7 (matches sim-S32000-pilot); datastore = /project/...trial7_chunk0...:7000 (DATASTORE_PREFIX empty).
# Consumed by cluster/submit.sh.
WORKLOAD=export

# --- scheduler ---
PARTITION=medium96s
CONSTRAINT=sapphirerapids
NTASKS=1
MEM=128G
TIME=04:00:00
ARRAY=7
JOB_NAME=export-s32k-pilot
OUTPUT=./slurm_s32000_pilot/export-%A_%a.out
ERROR=./slurm_s32000_pilot/export-%A_%a.err

# --- runtime (TRIAL=array_id) ---
CHUNK_START=0
CHUNK_END=1
BATCH_SIZE=1
N_CHUNKS=1
CHUNK_DIR=/data/MOZAIK/S32000_pilot/chunks
OUTPUT_PREFIX=/data/MOZAIK/S32000_pilot/export/trial
# DATASTORE_PREFIX empty -> sim datastore sits in /project (mozaik-models/experanto/)
DATASTORE_PREFIX=
# EXPORT_MODE unset -> full export (spikes + screen), so we measure total export size and validate video screen.
# qpatch production container.
SIF_IMAGE=/mnt/vast-nhr/projects/nix00014/goirik/MOZAIK-new/mozaik-sif/mozaik-opt-qpatch_2026-07-14.sif
